<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wheelGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wheelGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wheelGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffed4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wheelGradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 12 sections of the wheel -->
  <!-- Section 1 (0-30 degrees) -->
  <path d="M 150 150 L 150 10 A 140 140 0 0 1 225 37.5 Z" fill="url(#wheelGradient1)"/>
  
  <!-- Section 2 (30-60 degrees) -->
  <path d="M 150 150 L 225 37.5 A 140 140 0 0 1 262.5 75 Z" fill="url(#wheelGradient2)"/>
  
  <!-- Section 3 (60-90 degrees) -->
  <path d="M 150 150 L 262.5 75 A 140 140 0 0 1 262.5 225 Z" fill="url(#wheelGradient3)"/>
  
  <!-- Section 4 (90-120 degrees) -->
  <path d="M 150 150 L 262.5 225 A 140 140 0 0 1 225 262.5 Z" fill="url(#wheelGradient4)"/>
  
  <!-- Section 5 (120-150 degrees) -->
  <path d="M 150 150 L 225 262.5 A 140 140 0 0 1 150 290 Z" fill="url(#wheelGradient1)"/>
  
  <!-- Section 6 (150-180 degrees) -->
  <path d="M 150 150 L 150 290 A 140 140 0 0 1 75 262.5 Z" fill="url(#wheelGradient2)"/>
  
  <!-- Section 7 (180-210 degrees) -->
  <path d="M 150 150 L 75 262.5 A 140 140 0 0 1 37.5 225 Z" fill="url(#wheelGradient3)"/>
  
  <!-- Section 8 (210-240 degrees) -->
  <path d="M 150 150 L 37.5 225 A 140 140 0 0 1 37.5 75 Z" fill="url(#wheelGradient4)"/>
  
  <!-- Section 9 (240-270 degrees) -->
  <path d="M 150 150 L 37.5 75 A 140 140 0 0 1 75 37.5 Z" fill="url(#wheelGradient1)"/>
  
  <!-- Section 10 (270-300 degrees) -->
  <path d="M 150 150 L 75 37.5 A 140 140 0 0 1 150 10 Z" fill="url(#wheelGradient2)"/>
  
  <!-- Section 11 (300-330 degrees) -->
  <path d="M 150 150 L 150 10 A 140 140 0 0 1 225 37.5 Z" fill="url(#wheelGradient3)"/>
  
  <!-- Section 12 (330-360 degrees) -->
  <path d="M 150 150 L 225 37.5 A 140 140 0 0 1 262.5 75 Z" fill="url(#wheelGradient4)"/>
  
  <!-- Outer border -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="#fff" stroke-width="4"/>
  
  <!-- Inner circle -->
  <circle cx="150" cy="150" r="120" fill="#1a1a2e" stroke="#fff" stroke-width="2"/>
  
  <!-- Dividing lines for 12 sections -->
  <g stroke="#fff" stroke-width="2">
    <!-- Vertical lines -->
    <line x1="150" y1="10" x2="150" y2="290"/>
    <line x1="262.5" y1="75" x2="37.5" y2="225"/>
    <line x1="37.5" y1="75" x2="262.5" y2="225"/>
    
    <!-- Horizontal lines -->
    <line x1="10" y1="150" x2="290" y2="150"/>
    <line x1="75" y1="37.5" x2="225" y2="262.5"/>
    <line x1="225" y1="37.5" x2="75" y2="262.5"/>
  </g>
  
  <!-- Center circle -->
  <circle cx="150" cy="150" r="20" fill="#fff"/>
  <circle cx="150" cy="150" r="15" fill="#1a1a2e"/>
  
  <!-- Category numbers (1-12) -->
  <g fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="150" y="50">1</text>
    <text x="220" y="80">2</text>
    <text x="250" y="150">3</text>
    <text x="220" y="220">4</text>
    <text x="150" y="250">5</text>
    <text x="80" y="220">6</text>
    <text x="50" y="150">7</text>
    <text x="80" y="80">8</text>
    <text x="150" y="50">9</text>
    <text x="220" y="80">10</text>
    <text x="250" y="150">11</text>
    <text x="220" y="220">12</text>
  </g>
</svg> 